components:
  securitySchemes:
    AutheliaSession:
      type: apiKey
      in: cookie
      name: authelia_session
      description: 브라우저의 인증 세션. 실제 쿠키명은 Authelia 설정과 일치시킨다. 앱은 쿠키를 직접 검증하지 않고 신뢰된 ForwardAuth 결과만 수신한다.
    InternalService:
      type: apiKey
      in: header
      name: X-Internal-Service-Secret
      description: 내부망 전용 서비스 인증. 전달 사용자 문맥도 별도로 검증; 외부 Ingress 노출 금지.
  schemas:
    OffsetMeta:
      type: object
      properties:
        currentPage:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        totalCount:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
      required:
      - currentPage
      - limit
      - totalCount
      - totalPages
      additionalProperties: false
    CursorMeta:
      type: object
      properties:
        nextCursor:
