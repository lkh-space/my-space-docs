openapi: 3.1.1
info:
  title: my-space v2 backend contract
  version: 2.0.0-review
  description: v2 검토 명세. 현재 v1 구현 및 배포 완료 사실과 구분한다. BE-002/004/005/013 참조.
servers:
- url: /
  description: 동일 출처 Ingress. 배포 주소는 INF 설정
security:
- AutheliaSession: []
x-csrf-policy:
  browser-api: same-origin
  unsafe-methods:
  - POST
  - PUT
  - PATCH
  - DELETE
  origin: exact-configured-web-origin-required
  reject-missing-or-null-origin: true
  reject-cross-site-fetch-metadata: true
  credentialed-cross-origin-cors: false
  failure-code: ERR_AUTH_ORIGIN_REJECTED
  enforcement: before-body-parsing-and-side-effects
  internal-service: separate-service-auth-not-public
x-private-response-cache: no-store
paths:
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      summary: 현재 인증 사용자
      description: 현재 인증 사용자
      tags:
      - auth
      x-roles:
      - OWNER
      - GUEST
      x-requirements:
      - REQ-030
      x-entities: []
      responses:
        '200':
          description: 현재 인증 사용자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '500':
          $ref: '#/components/responses/Problem500'
      x-error-codes:
      - ERR_AUTH_FORBIDDEN
      - ERR_AUTH_UNAUTHENTICATED
      - ERR_COMMON_INTERNAL_SERVER
      - ERR_COMMON_NOT_FOUND
      - ERR_COMMON_VALIDATION
  /api/v1/samples/{space}:
    get:
      operationId: getSpaceSamples
      summary: 읽기 전용 체험 샘플
      description: 읽기 전용 체험 샘플
      tags:
      - samples
      x-roles:
      - OWNER
      - GUEST
      x-requirements:
      - REQ-026
      x-entities: []
      responses:
        '200':
          description: 읽기 전용 체험 샘플
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SampleData'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '500':
          $ref: '#/components/responses/Problem500'
      parameters:
      - name: space
        in: path
        required: true
        schema:
          type: string
          enum:
          - home
          - notes
          - feeds
          - management
          - ai
      x-error-codes:
      - ERR_AUTH_FORBIDDEN
      - ERR_AUTH_UNAUTHENTICATED
      - ERR_COMMON_INTERNAL_SERVER
      - ERR_COMMON_NOT_FOUND
      - ERR_COMMON_VALIDATION
  /api/v1/home/summary:
    get:
      operationId: getHomeSummary
      summary: 소유자별 공간 요약
      description: 인증·인가/전체 요청 실패는 HTTP Problem으로 반환한다. 처리 가능한 요청의 카드별 실패는 200 HomeSummary의 ERROR로 표현한다(모든 카드가 실패한 경우도 포함).
        요청된 카드는 누락하지 않는다.
      tags:
      - home
      x-roles:
      - OWNER
      x-requirements:
      - REQ-002
      x-entities: []
      responses:
        '200':
          description: 소유자별 공간 요약
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeSummary'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '500':
          $ref: '#/components/responses/Problem500'
      x-error-codes:
      - ERR_AUTH_FORBIDDEN
      - ERR_AUTH_UNAUTHENTICATED
      - ERR_COMMON_INTERNAL_SERVER
      - ERR_COMMON_NOT_FOUND
      - ERR_COMMON_VALIDATION
      parameters:
      - name: sections
        in: query
        required: false
        style: form
        explode: false
        schema:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
            - upcomingSchedules
            - overdueSchedules
            - monthlyTotalKrw
            - unreadPriorityFeedCount
            - recentDocuments
            - unreadNotifications
        description: 쉼표 구분 카드 이름. 생략 시 전체. 개별 재시도는 해당 카드만 요청.
