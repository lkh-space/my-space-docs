          - ERR_FOLDER_DUPLICATE_NAME
          - ERR_NOTE_STORAGE_UPLOAD_FAILED
          - ERR_FEED_INVALID_URL
          - ERR_FEED_DUPLICATE_SOURCE
          - ERR_FEED_FETCH_FAILED
          - ERR_FEED_DUPLICATE_RULE
          - ERR_SCHEDULE_INVALID_TYPE
          - ERR_SCHEDULE_INVALID_RENEWAL
          - ERR_SCHEDULE_VERSION_CONFLICT
          - ERR_AI_QUOTA_EXCEEDED
          - ERR_AI_UPSTREAM_FAILED
          - ERR_AI_VECTOR_SEARCH_FAILED
          - ERR_AI_MESSAGE_NOT_COMPLETE
          - ERR_PDF_INVALID_FILE
          - ERR_PDF_INVALID_RANGE
          - ERR_PDF_PASSWORD_REQUIRED
          - ERR_PDF_WRONG_PASSWORD
          - ERR_PDF_LIMIT_EXCEEDED
          - ERR_PDF_UNSUPPORTED
          - ERR_PDF_TIMEOUT
          - ERR_COMMON_BUSY
          - ERR_HOLIDAY_UNAVAILABLE
